<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="opexGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="opexGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagonal Frame -->
  <polygon points="60,8 106,34 106,86 60,112 14,86 14,34" 
           fill="#0B0F19" 
           stroke="url(#opexGrad1)" 
           stroke-width="4.5" 
           stroke-linejoin="round" />

  <!-- Inner Ambient Hexagon Grid -->
  <polygon points="60,20 96,40 96,80 60,100 24,80 24,40" 
           fill="url(#opexGrad2)" 
           stroke="rgba(255, 255, 255, 0.15)" 
           stroke-width="1.5" />

  <!-- Central Camera Aperture / Matrix Kernel Nodes -->
  <!-- 3x3 Grid Dots representing Computer Vision Matrix -->
  <g filter="url(#glow)">
    <!-- Diagonal Pipeline Beam -->
    <path d="M35,85 L85,35" stroke="url(#opexGrad1)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 4" />
    
    <!-- Matrix Bracket Left -->
    <path d="M42,40 L36,40 L36,80 L42,80" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Matrix Bracket Right -->
    <path d="M78,40 L84,40 L84,80 L78,80" fill="none" stroke="#C084FC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Central Glowing Core Aperture -->
    <circle cx="60" cy="60" r="11" fill="none" stroke="url(#opexGrad1)" stroke-width="3.5" />
    <circle cx="60" cy="60" r="4.5" fill="#38BDF8" />

    <!-- Surrounding 4 Tensor Nodes -->
    <circle cx="48" cy="48" r="2.5" fill="#A855F7" />
    <circle cx="72" cy="48" r="2.5" fill="#38BDF8" />
    <circle cx="48" cy="72" r="2.5" fill="#38BDF8" />
    <circle cx="72" cy="72" r="2.5" fill="#A855F7" />
  </g>
</svg>
